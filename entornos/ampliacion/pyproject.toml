[project]
name = "lexia-ampliacion-asr"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.7.1", "torchaudio==2.7.1", "transformers==5.20.2", "accelerate==1.15.0",
  "numpy==2.2.6", "soundfile==0.13.1", "psutil==7.2.2", "jiwer==4.0.0",
  "librosa==0.11.0", "sentencepiece==0.2.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
