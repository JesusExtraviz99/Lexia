[project]
name = "lexia-asr-servidor"
version = "0.1.0"
description = "Entornos aislados de evaluación ASR en Ubuntu x86_64"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6",
  "soundfile==0.13.1",
  "psutil==7.2.2",
  "jiwer==4.0.0",
]

[project.optional-dependencies]
transformers = [
  "torch==2.7.1",
  "transformers==5.20.2",
  "accelerate==1.15.0",
  "librosa==0.11.0",
  "sentencepiece==0.2.2",
]
crisper = [
  "crisperwhisper[transformers]==2.0.3",
  "torch==2.7.1",
  "transformers==5.20.2",
  "accelerate==1.15.0",
  "librosa==0.11.0",
]
whisper = [
  "faster-whisper==1.2.1",
  "ctranslate2==4.4.0",
  "av==16.0.1",
  "nvidia-cublas-cu12==12.1.3.1",
  "nvidia-cudnn-cu12==8.9.7.29",
]
vosk = ["vosk==0.3.45"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
